apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kam-internal
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kam-internal
  minReplicas: 9
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
