apiVersion: apps/v1
kind: Deployment
metadata:
  name: kam-internal
  namespace: production
  labels:
    component: kam-internal
spec:
  replicas: 2
  selector:
    matchLabels:
      component: kam-internal
  template:
    metadata:
      labels:
        component: kam-internal
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: internal-sip
      volumes:
        - name: google-service-account
          secret:
            secretName: google-service-account
      containers:
        - name: sidecar
          image: us-docker.pkg.dev/voxo-5060/voxoco/voxo-telecom:latest
          ports:
            - name: metrics
              containerPort: 3000
          env:
            - name: SERVICE
              value: kam-internal
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: mysql-url
                  key: connectionString
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-details
                  key: clusterName
            - name: SERVERIDENV
              valueFrom:
                configMapKeyRef:
                  name: cluster-details
                  key: serverId
            - name: SERVERID
              value: "6$(SERVERIDENV)"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
          volumeMounts:
            - name: google-service-account
              mountPath: /var/secrets/google
          imagePullPolicy: Always
        - name: kam-internal
          image: us-docker.pkg.dev/voxo-5060/voxoco/kamailio:latest
          command: [ "/entrypoint_internal.sh" ]
          resources:
            requests:
              cpu: 1200m
          ports:
            - containerPort: 8080
          env:
            - name: PODIP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: cluster-details
                  key: clusterName
            - name: TZ
              value: America/Chicago
            - name: PODNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVERIDENV
              valueFrom:
                configMapKeyRef:
                  name: cluster-details
                  key: serverId
            - name: SERVERID
              value: "6$(SERVERIDENV)"
            - name: DISPATCHMODE
              value: "1"
          imagePullPolicy: Always
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: kam-internal
  namespace: production
  labels:
    component: kam-internal
spec:
  selector:
    component: kam-internal
  clusterIP: None